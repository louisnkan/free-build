<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#14141A">
  <meta name="description" content="Find everything you need from Sample Studio in one place.">
  <title>Sample Studio — Find Us Here</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14141A;
      --coral: #FF6B57;
      --cream: #F7F0E5;
      --muted: #AAA6B2;
      --surface: #201F27;
      --border: rgba(247, 240, 229, 0.09);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 32px 20px 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(ellipse at 50% 5%, rgba(255, 107, 87, 0.09), transparent 42%),
        var(--bg);
      color: var(--cream);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 420px;
      margin: auto;
      text-align: center;
    }

    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
      animation: fade-up 650ms ease both;
    }

    .logo-wrap {
      position: relative;
      display: grid;
      place-items: center;
      width: 104px;
      height: 104px;
      margin-bottom: 22px;
      border-radius: 50%;
      background: linear-gradient(145deg, #FF9B82, #FF6B57 48%, #9F4058);
      box-shadow:
        0 0 25px rgba(255, 107, 87, 0.23),
        0 0 65px rgba(255, 107, 87, 0.10);
    }

    .logo {
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      border-radius: 50%;
      background: #201B24;
      font-size: 43px;
      line-height: 1;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--coral);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 2.8px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 38px);
      font-weight: 760;
      letter-spacing: -1.6px;
      line-height: 1.15;
    }

    .tagline {
      margin: 12px 0 0;
      max-width: 310px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .links {
      display: grid;
      gap: 12px;
      animation: fade-up 650ms 120ms ease both;
    }

    .link {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      min-height: 60px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 15px;
      background: var(--surface);
      color: var(--cream);
      text-decoration: none;
      text-align: left;
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      -webkit-tap-highlight-color: transparent;
      transition:
        transform 160ms ease,
        background-color 160ms ease,
        border-color 160ms ease,
        box-shadow 160ms ease;
    }

    .link.primary {
      border-color: transparent;
      background: var(--coral);
      color: #24171A;
      box-shadow: 0 5px 18px rgba(255, 107, 87, 0.12);
    }

    .link:hover {
      border-color: rgba(255, 107, 87, 0.5);
      background-color: #292630;
    }

    .link.primary:hover {
      background: #FF806D;
      border-color: transparent;
    }

    .link:active {
      transform: scale(0.975);
    }

    .link:focus-visible {
      outline: 2px solid var(--coral);
      outline-offset: 4px;
    }

    .link-start {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .link-icon {
      display: grid;
      flex-shrink: 0;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(247, 240, 229, 0.07);
      font-size: 17px;
    }

    .primary .link-icon {
      background: rgba(36, 23, 26, 0.09);
    }

    .link-label {
      overflow-wrap: anywhere;
    }

    .arrow {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 19px;
      font-weight: 400;
      transition: transform 160ms ease;
    }

    .primary .arrow {
      color: #24171A;
    }

    .link:hover .arrow {
      transform: translateX(3px);
    }

    footer {
      margin-top: 32px;
      color: #77727F;
      font-size: 11px;
      letter-spacing: 0.35px;
      animation: fade-up 650ms 220ms ease both;
    }

    .footer-mark {
      display: inline-block;
      margin-right: 5px;
      color: var(--coral);
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 600px) {
      body {
        padding-top: 44px;
        padding-bottom: 36px;
      }

      .profile {
        margin-bottom: 34px;
      }

      .links {
        gap: 14px;
      }

      .link {
        min-height: 64px;
        padding: 15px 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="profile">
      <div class="logo-wrap" aria-label="Sample Studio logo">
        <div class="logo" aria-hidden="true">✨</div>
      </div>

      <p class="eyebrow">Your next favorite thing</p>
      <h1>Sample Studio</h1>
      <p class="tagline">Little details. Thoughtful creations. Made with love.</p>
    </header>

    <nav class="links" aria-label="Sample Studio links">
      <a class="link primary" href="#" aria-label="Order on WhatsApp — placeholder link">
        <span class="link-start">
          <span class="link-icon" aria-hidden="true">💬</span>
          <span class="link-label">Order on WhatsApp</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="#" aria-label="Instagram — placeholder link">
        <span class="link-start">
          <span class="link-icon" aria-hidden="true">📸</span>
          <span class="link-label">Instagram</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="#" aria-label="Price list — placeholder link">
        <span class="link-start">
          <span class="link-icon" aria-hidden="true">🧾</span>
          <span class="link-label">Price list</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="#" aria-label="Location — placeholder link">
        <span class="link-start">
          <span class="link-icon" aria-hidden="true">📍</span>
          <span class="link-label">Location</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>

      <a class="link" href="#" aria-label="Call us — placeholder link">
        <span class="link-start">
          <span class="link-icon" aria-hidden="true">📞</span>
          <span class="link-label">Call us</span>
        </span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>

    <footer>
      <span class="footer-mark" aria-hidden="true">✳</span>
      Built on a phone with AI.
    </footer>
  </main>
</body>
</html>
